name: deploy-prod
# Synced from platform templates/github/app-deploy-prod.yml — edit there first, then copy here.
# Semver tags only: vMAJOR.MINOR.PATCH → Environment prod.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build and push
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [[ "$ECR_REPOSITORY" == *".amazonaws.com/"* ]]; then
            REPO="$ECR_REPOSITORY"
          else
            REPO="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          fi
          SHA="${REPO}:${IMAGE_TAG}"
          docker build -t "$SHA" -t "${REPO}:latest" .
          docker push "$SHA"
          docker push "${REPO}:latest"
          echo "uri=$SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy ECS
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          TASK=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK" --query 'taskDefinition' > /tmp/td.json
          python3 - <<'PY'
          import json, os
          td = json.load(open("/tmp/td.json"))
          for k in ["taskDefinitionArn","revision","status","requiresAttributes","compatibilities","registeredAt","registeredBy","deregisteredAt","deregisteredBy","enableFaultInjection"]:
              td.pop(k, None)
          td["containerDefinitions"][0]["image"] = os.environ["IMAGE"]
          json.dump(td, open("/tmp/td-new.json","w"))
          PY
          NEW=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          EXTRA=()
          if [[ "$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'length(services[0].loadBalancers)' --output text)" != "0" ]]; then
            EXTRA+=(--health-check-grace-period-seconds 300)
          fi
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW" --desired-count 1 --force-new-deployment "${EXTRA[@]}"
          echo "updated $SERVICE -> $NEW image=$IMAGE"
          echo "waiting for $SERVICE to become stable..."
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].{desired:desiredCount,running:runningCount,deployments:deployments[*].{status:status,rollout:rolloutState,running:runningCount,pending:pendingCount,failed:failedTasks}}' \
              --output json
            ready=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'length(services[0].deployments)==`1` && services[0].runningCount==services[0].desiredCount && services[0].desiredCount>`0`' \
              --output text)
            if [[ "$ready" == "True" ]]; then
              echo "service $SERVICE is stable"
              exit 0
            fi
            sleep 15
          done
          echo "service $SERVICE did not become stable" >&2
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].events[:8]' --output table
          exit 1
